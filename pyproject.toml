[project]
name = "clareza-financeira"
version = "0.1.0"
description = "Gestao financeira pessoal com plano de regularizacao de dividas."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23,<26",
    "bandit>=1.7,<2",
    "black>=24,<26",
    "celery[redis]>=5.4,<6",
    "coverage>=7,<8",
    "django>=5.2,<5.3",
    "factory-boy>=3.3,<4",
    "gunicorn>=23,<24",
    "pip-audit>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "redis>=6.1,<7",
    "ruff>=0.8,<1",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  \.venv
  | node_modules
  | staticfiles
  | media
  | migrations
)/
'''
force-exclude = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", "staticfiles", "media", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
