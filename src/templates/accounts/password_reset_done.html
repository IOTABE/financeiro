{% extends "base.html" %}

{% block title %}Link enviado — {{ APP_NAME }}{% endblock %}

{% block content %}
  <section class="auth auth--compact">
    <div class="auth__card glass-card">
      <p class="eyebrow">Verifique seu e-mail</p>
      <h1>Link enviado</h1>
      <p class="muted">
        Se houver uma conta com esse e-mail, você receberá um link para redefinir
        a senha. O link expira em 30 minutos.
      </p>
      <a class="btn btn-outline btn-block" href="{% url 'accounts:login' %}">Voltar para entrar</a>
    </div>
  </section>
{% endblock %}
