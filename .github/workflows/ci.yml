name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-insecure-key-not-for-production-0123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Django checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test

      - name: Static security scan
        run: bandit -q -r src -x tests

      - name: Dependency audit
        run: pip-audit -r requirements/prod.txt

      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-insecure-key-not-for-production-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DATABASE_URL: postgresql://clareza:clareza@localhost:5432/clareza
        run: python manage.py check --deploy

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.dev.yaml config > /dev/null

      - name: Build image
        run: docker build -f docker/Dockerfile -t clareza:ci .
